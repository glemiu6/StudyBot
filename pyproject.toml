[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-rag"
version = "0.1.0"
description = "A local RAG pipeline to chat with your documents and YouTube videos"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyragcore[all]==0.3.4",
    "pymupdf==1.28.2",
    "python-docx>=1.2.0",
    "pandas==3.0.5",
    "yt-dlp>=2026.3.17",
    "openai-whisper>=20250625",
    "langid>=1.1.6",
    "torch",
    "torchvision",
    "fastapi>=0.141.1",
    "python-multipart>=0.0.32",
]

# Add your development dependencies here
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
    "black>=24.0",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
include = ["ingest*", "utils_io*"]

[dependency-groups]
dev = [
    "uvicorn>=0.52.4",
]
